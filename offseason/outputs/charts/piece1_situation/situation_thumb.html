<!DOCTYPE html><html><head><meta charset="utf-8"><style>html,body{margin:0;padding:0;background:#050505;width:1280px;height:720px;overflow:hidden}</style></head><body>
<!-- Piece 1 thumbnail, 16:9. True scale: $0 to $230M across 1280px (5.5652 px per $M).
     The bar is the real 2026-27 books, nine contracts plus the roster charge stub,
     each segment at its true width. Walls: tax $201M (faint), first apron $209.1M
     (full bleed, the one that matters), second apron $222M (dim). Gap = $15.1M.
     Glows are layered strokes, not filters: a filter on a zero-width line collapses
     its bounding box and the element disappears. -->
<svg width="1280" height="720" viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg">
<defs>
  <radialGradient id="amb-red" cx="50%" cy="50%" r="50%">
    <stop offset="0%" stop-color="#FF5C5C" stop-opacity="0.13"/>
    <stop offset="60%" stop-color="#FF5C5C" stop-opacity="0.06"/>
    <stop offset="100%" stop-color="#FF5C5C" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="amb-green" cx="50%" cy="50%" r="50%">
    <stop offset="0%" stop-color="#00843D" stop-opacity="0.07"/>
    <stop offset="100%" stop-color="#00843D" stop-opacity="0"/>
  </radialGradient>
</defs>

<rect x="0" y="0" width="1280" height="720" fill="#050505"/>

<!-- ambient depth, soft falloff -->
<circle cx="380" cy="380" r="460" fill="url(#amb-green)"/>
<circle cx="1164" cy="360" r="420" fill="url(#amb-red)"/>

<!-- tax line, $201M, faint dashed -->
<line x1="1118.6" y1="190" x2="1118.6" y2="480" stroke="rgba(255,255,255,0.16)" stroke-width="1.5" stroke-dasharray="5,5"/>
<text x="1118.6" y="176" text-anchor="middle" fill="rgba(255,255,255,0.30)"
  font-family="Segoe UI, Inter, sans-serif" font-size="10" font-weight="600" letter-spacing="1.5">TAX</text>
<!-- second apron, $222M, dim -->
<line x1="1235.5" y1="190" x2="1235.5" y2="480" stroke="#FF5C5C" stroke-width="2" opacity="0.22"/>
<text x="1235.5" y="176" text-anchor="middle" fill="rgba(255,92,92,0.35)"
  font-family="Segoe UI, Inter, sans-serif" font-size="10" font-weight="600" letter-spacing="1.5">2ND APRON</text>

<!-- first apron, $209.1M: full bleed, layered manual glow -->
<line x1="1163.7" y1="0" x2="1163.7" y2="720" stroke="#FF5C5C" stroke-width="20" opacity="0.10"/>
<line x1="1163.7" y1="0" x2="1163.7" y2="720" stroke="#FF5C5C" stroke-width="10" opacity="0.26"/>
<line x1="1163.7" y1="0" x2="1163.7" y2="720" stroke="#FF5C5C" stroke-width="4" opacity="0.95"/>

<!-- the wall's callout, lower right, pointing at the line -->
<text x="1010" y="560" text-anchor="end" fill="#FF5C5C" opacity="0.95"
  font-family="Segoe UI, Inter, sans-serif" font-size="18" font-weight="600" letter-spacing="2.5">FIRST APRON &#183; $209.1M</text>
<line x1="1022" y1="553" x2="1142" y2="553" stroke="rgba(255,92,92,0.7)" stroke-width="1.5"/>
<path d="M 1142 547 L 1154 553 L 1142 559 Z" fill="rgba(255,92,92,0.8)"/>

<!-- the books: nine contracts plus the roster charge stub, true widths, 2px seams -->
<!-- Edwards 48.9 -->
<rect x="0" y="270" width="271.1" height="200" fill="#00843D"/>
<!-- Gobert 36.5 -->
<rect x="273.1" y="270" width="201.2" height="200" fill="#00763A"/>
<!-- Randle 33.3 -->
<rect x="476.3" y="270" width="183.3" height="200" fill="#00843D"/>
<!-- McDaniels 25.8 -->
<rect x="661.6" y="270" width="141.6" height="200" fill="#00763A"/>
<!-- Naz 23.3 -->
<rect x="805.2" y="270" width="127.6" height="200" fill="#00843D"/>
<!-- DiVincenzo 12.5 -->
<rect x="934.8" y="270" width="67.6" height="200" fill="#00763A"/>
<!-- Beringer 4.4 -->
<rect x="1004.4" y="270" width="22.5" height="200" fill="#00843D"/>
<!-- Shannon 2.8 -->
<rect x="1028.9" y="270" width="13.6" height="200" fill="#00763A"/>
<!-- Phillips 2.4 -->
<rect x="1044.5" y="270" width="11.3" height="200" fill="#00843D"/>
<!-- roster charges 4.1, a placeholder not a contract -->
<rect x="1057.8" y="270" width="21.9" height="200" fill="#00843D" fill-opacity="0.30"
  stroke="rgba(0,196,87,0.45)" stroke-width="1" stroke-dasharray="4,3"/>

<!-- names inside the big segments: the books, readable -->
<g font-family="Segoe UI, Inter, sans-serif" font-size="13" font-weight="600" letter-spacing="1.2" fill="rgba(255,255,255,0.62)">
  <text x="16" y="302">EDWARDS</text>
  <text x="289.1" y="302">GOBERT</text>
  <text x="492.3" y="302">RANDLE</text>
  <text x="677.6" y="302">MCDANIELS</text>
  <text x="821.2" y="302">REID</text>
  <text x="948.8" y="302">DONTE</text>
</g>
<g font-family="JetBrains Mono, Consolas, monospace" font-size="12" fill="rgba(255,255,255,0.42)">
  <text x="16" y="324">$48.9M</text>
  <text x="289.1" y="324">$36.5M</text>
  <text x="492.3" y="324">$33.3M</text>
  <text x="677.6" y="324">$25.8M</text>
  <text x="821.2" y="324">$23.3M</text>
  <text x="948.8" y="324">$12.5M</text>
</g>

<!-- the room itself, faintly lit -->
<rect x="1082" y="270" width="79.7" height="200" fill="rgba(255,255,255,0.05)"/>

<!-- leading edge of the money, manual glow -->
<rect x="1073.7" y="270" width="9" height="200" fill="#00C457" opacity="0.25"/>
<rect x="1076.7" y="270" width="3" height="200" fill="#00C457"/>

<!-- the gap: bracket under it, hero number in the open middle, leader pointing in -->
<path d="M 1081 492 L 1081 500 L 1162 500 L 1162 492" fill="none" stroke="rgba(255,255,255,0.6)" stroke-width="2"/>
<text x="600" y="165" text-anchor="middle" fill="#FFFFFF"
  font-family="JetBrains Mono, Consolas, monospace" font-size="88" font-weight="700">$15.1M</text>
<path d="M 775 137 L 1095 137 L 1095 250" fill="none" stroke="rgba(255,255,255,0.45)" stroke-width="1.5"/>
<path d="M 1089 250 L 1101 250 L 1095 262 Z" fill="rgba(255,255,255,0.55)"/>

<!-- true-scale ruler along the bottom -->
<line x1="0" y1="624" x2="1280" y2="624" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
<g stroke="rgba(255,255,255,0.18)" stroke-width="1">
  <line x1="0.5" y1="624" x2="0.5" y2="631"/>
  <line x1="278.3" y1="624" x2="278.3" y2="631"/>
  <line x1="556.5" y1="624" x2="556.5" y2="631"/>
  <line x1="834.8" y1="624" x2="834.8" y2="631"/>
  <line x1="1113" y1="624" x2="1113" y2="631"/>
</g>
<g font-family="JetBrains Mono, Consolas, monospace" font-size="11" fill="rgba(255,255,255,0.28)">
  <text x="4" y="650" text-anchor="start">$0</text>
  <text x="278.3" y="650" text-anchor="middle">$50M</text>
  <text x="556.5" y="650" text-anchor="middle">$100M</text>
  <text x="834.8" y="650" text-anchor="middle">$150M</text>
  <text x="1113" y="650" text-anchor="middle">$200M</text>
</g>

<!-- watermark, bottom left this time: the wall owns the bottom right corner -->
<text x="16" y="706" text-anchor="start" fill="rgba(255,255,255,0.30)"
  font-family="Segoe UI, Inter, sans-serif" font-size="12">@WolvesToaT &#183; Jun 2026</text>
</svg></body></html>
