# fitengine model parameters. Seeds govern every stochastic entry point;
# full runs reproduce bit-for-bit.

seed: 20260702

panel:
  seasons: [2014, 2015, 2016, 2017, 2018, 2019, 2020, 2021, 2022, 2023, 2024, 2025, 2026]
  # end-year convention (2014 = 2013-14). Train filter: include_train from
  # game_universe.parquet (002 prefix ONLY, R1); playoffs flagged diagnostic.
  # R2 amendment 3: conformal calibration and coverage-gated seasons MUST
  # be disjoint (calibrating on a gated season makes that gate circular --
  # split-conformal hits ~80% on its own calibration season by
  # construction). Calibration = 2019; the G3 coverage gate evaluates
  # 2020 and 2021 ONLY. R2 log-item 6: G3 reports per-season alongside
  # pooled (two of three targets are pandemic-shaped; anomalies must be
  # visible, not averaged away).
  dev_seasons_layer2_holdout: [2019, 2020, 2021]   # G3 temporal RMSE targets
  coverage_gate_seasons: [2020, 2021]              # G3 coverage rows

layer1a:
  ridge_alpha: gcv_on_dev_only    # frozen after F2 dev selection
  bootstrap_resamples: 200
  prior_blend: {prev_season_aged: 0.6, box_composite: 0.4}  # dev-tunable pre-freeze
  covariance_block_min_shared_poss: 500   # A1

layer1b:
  K_candidates: [6, 8, 10]        # Bobby-ratified; frozen selection on dev
  K: 8                            # RATIFIED 2026-07-03 (Bobby). FA beats pPCA at
                                  # all K; soft elbow at 8 on reconstruction (6->8
                                  # gain 2.6x the 8->10) and the G3 proxy; matches
                                  # pre-logged P-K. skill_vectors ship ONLY after
                                  # the Bayesian health gates below pass at K=8.
  health_gates: {max_r_hat: 1.01, min_ess_bulk: 400}  # + anchor sign-stability
  dense_mass: true             # cures the correlated-loadings geometry (the real wall)
  max_tree_depth: 8           # dense mass keeps trees shallow; generous cap (perf, 2026-07-03)
                                  # params); score all player-seasons post-hoc (perf, 2026-07-03)
  num_warmup: 1000
  num_samples: 1000
  chain_method: sequential     # vectorized dense-mass compile stalled on CPU (2026-07-03)
  num_chains: 4

layer2:
  gbm: lightgbm                   # smoke-verified at F0; sklearn HGB fallback wrapper
  primary: set_attention          # 2 blocks, width 64-128; GNN accepted alternative
  ensemble_seeds: 8
  conformal_holdout_season: 2019  # DISJOINT from coverage_gate_seasons (R2 am. 3)
  team_season_intercept: dev_ablation   # A4
  leverage_weighting: frozen_at_F1      # A3, basis = adapters tag_garbage_time/tag_clutch

# R2 amendment 4: cross-repo artifacts carry content hashes (sha256/16),
# verified at load by src/adapters/pinned_artifacts.py, same posture as the
# AM-1 fence. The aging posterior pinned is the CONVERGED v1.1 fit
# (r_hat 1.005; its sibling b8bb2da2 is the unconverged v1 at r_hat 1.60
# and must never be loaded).
pinned_artifacts:
  postmortem_lib: config/pinned_lib.yaml            # AM-1 (git blob hashes)
  model_c_aging_posterior:
    path: ../pick2033/outputs/posteriors/aging_with_imputation_6470b7ff80a023e1.parquet
    sha256_16: 2843ed490a242357
  draft_outcomes_db:
    path: ../pick2033/data/warehouse.duckdb
    sha256_16: 128c951b61ac5f8c
