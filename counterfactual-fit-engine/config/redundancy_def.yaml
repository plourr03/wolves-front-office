# The redundancy score — FROZEN at F0 (2026-07-02), before anyone sees any
# value of it. The Edwards-Ball value of this quantity is the flagship's
# headline number; the definition cannot be shopped after the fact.

definition: model_based_double_difference
formula: >
  For pair (i, j) in context lineup C (R2 amendment 2a, explicit
  subscripts -- r_i and r_j are DIFFERENT archetypes at i's and j's
  positions respectively):
  f(C + i + j) - f(C + i + r_j) - f(C + r_i + j) + f(C + r_i + r_j)
  Averaged over the fixed context-lineup set and reference defenses.
  Positive = complementary, negative = redundant. Units: net-rating points.

replacement_archetype:
  # Bobby's rulings 2026-07-02 (R2 amendment 2b resolves the construction
  # ambiguity): the archetype is the minutes-weighted MEAN VECTOR of the
  # players in the 20th-30th percentile impact band at the position,
  # computed on development seasons only, frozen with this file. It is NOT
  # a per-dimension percentile (which would produce a chimera no player
  # resembles).
  construction: minutes_weighted_mean_vector_of_20th_to_30th_pctile_impact_band
  band: [0.20, 0.30]
  band_metric: minutes_weighted_impact_at_position
  seasons: development_only

context_lineups: fixed set defined at F6 config-freeze BEFORE any
  Edwards-Ball computation; drawn from plausible 2026-27 Wolves fives with
  the pair's slots vacated
reference_defenses: the frozen reference-opponent set (Layer 3)

secondary_illustration_only:
  creation_subspace_cosine: computed for the piece as description, never
    the headline; explicitly not load-bearing
