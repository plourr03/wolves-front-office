<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Edwards is not Conley, bar version</title>
<script src="https://d3js.org/d3.v7.min.js"></script>
<style>
  :root {
    --accent-default:#00843D; --accent-hover:#00A04A; --accent-subtle:rgba(0,132,61,.18);
    --dataviz-1:#00C457; --dataviz-2:#FFFFFF; --dataviz-3:#4A9EFF; --dataviz-4:#F5A623;
    --dataviz-5:#FF5C8A; --dataviz-6:#B388FF; --dataviz-7:#7CE7B8; --dataviz-8:#FFD166;
    --text-primary:#FFFFFF; --text-secondary:rgba(255,255,255,.72); --text-tertiary:rgba(255,255,255,.48);
    --border-subtle:rgba(255,255,255,.08); --border-default:rgba(255,255,255,.16);
    --status-error:#FF5C5C; --status-warning:#F5A623; --status-info:#4A9EFF; --status-success:#00A04A;
    --bg-surface:#0E0E0E; --bg-inset:#050505;
    --family-sans:'Inter',system-ui,-apple-system,sans-serif;
    --family-mono:'JetBrains Mono',ui-monospace,Menlo,monospace;
    --radius-sm:4px; --radius-md:10px;
  }
  body { margin:0; padding:32px; background:#000; }
  .harness-note {
    max-width:960px; margin:0 auto 16px; color:rgba(255,255,255,.4);
    font:12px var(--family-sans);
  }
  .harness-stage { max-width:960px; margin:0 auto; }
</style>
</head>
<body>
<div class="harness-note">Local preview harness. The publishable artifact is edwards_conley_bar_fragment.html.</div>
<div class="harness-stage">
<div id="viz-edwards-conley-bar"></div>
<script>
(function () {
  var data = [
    {
      name: "Mike Conley",
      role: "The point guard the Wolves had",
      astTo: 4.4,
      color: "var(--dataviz-3)",
      detail: "Held above 4.2 every season the Wolves had him."
    },
    {
      name: "Anthony Edwards",
      role: "The point guard the Wolves used",
      astTo: 1.4,
      color: "var(--accent-default)",
      detail: "Between 1.3 and 1.7 each of the last three seasons."
    }
  ];

  var root = d3.select("#viz-edwards-conley-bar");
  var reduceMotion =
    window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  function render() {
    root.selectAll("*").remove();

    var raw = root.node().clientWidth || 640;
    var width = Math.max(320, Math.min(960, raw));
    var compact = width < 480;

    var rowH = compact ? 132 : 108;
    var headerH = 84;
    var height = headerH + data.length * rowH + 24;

    var margin = {
      right: 88,
      left: compact ? 16 : 200
    };

    var svg = root.append("svg")
      .attr("width", width)
      .attr("height", height)
      .attr("viewBox", "0 0 " + width + " " + height)
      .attr("role", "img")
      .style("display", "block")
      .style("max-width", "100%")
      .style("margin", "0 auto");

    svg.append("text")
      .attr("x", 16)
      .attr("y", 30)
      .style("fill", "var(--text-primary)")
      .style("font", "700 22px var(--family-sans)")
      .text("Edwards is not Conley.");

    svg.append("text")
      .attr("x", 16)
      .attr("y", 56)
      .style("fill", "var(--text-secondary)")
      .style("font", "13px var(--family-sans)")
      .text("Assists per turnover, the simplest measure of a playmaker.");

    var xScale = d3.scaleLinear()
      .domain([0, 5])
      .range([margin.left, width - margin.right]);

    data.forEach(function (d, i) {
      var rowTop = headerH + i * rowH;

      var barY = compact ? rowTop + 60 : rowTop + 36;
      var barH = compact ? 26 : 30;

      svg.append("text")
        .attr("x", compact ? 16 : margin.left - 16)
        .attr("y", compact ? rowTop + 20 : barY + barH / 2 - 4)
        .attr("text-anchor", compact ? "start" : "end")
        .style("fill", "var(--text-primary)")
        .style("font", "700 17px var(--family-sans)")
        .text(d.name);

      svg.append("text")
        .attr("x", compact ? 16 : margin.left - 16)
        .attr("y", compact ? rowTop + 38 : barY + barH / 2 + 14)
        .attr("text-anchor", compact ? "start" : "end")
        .style("fill", "var(--text-tertiary)")
        .style("font", "12px var(--family-sans)")
        .text(d.role);

      svg.append("rect")
        .attr("x", margin.left)
        .attr("y", barY)
        .attr("width", xScale(5) - margin.left)
        .attr("height", barH)
        .attr("rx", 4)
        .style("fill", "var(--bg-surface)")
        .style("stroke", "var(--border-subtle)")
        .style("stroke-width", 1);

      var bar = svg.append("rect")
        .attr("x", margin.left)
        .attr("y", barY)
        .attr("height", barH)
        .attr("rx", 4)
        .style("fill", d.color)
        .style("cursor", "pointer")
        .attr("width", reduceMotion ? xScale(d.astTo) - margin.left : 0);

      bar.append("title").text(d.name + ": " + d.astTo + " assist/turnover");

      bar
        .on("mouseenter", function () {
          d3.select(this).style("fill", "var(--accent-hover)");
        })
        .on("mouseleave", function () {
          d3.select(this).style("fill", d.color);
        });

      var valueText = svg.append("text")
        .attr("x", xScale(d.astTo) + 14)
        .attr("y", barY + barH / 2)
        .attr("dy", "0.35em")
        .style("fill", d.color)
        .style("font", "800 32px var(--family-mono)")
        .style("opacity", reduceMotion ? 1 : 0)
        .text(d.astTo);

      svg.append("text")
        .attr("x", compact ? 16 : margin.left)
        .attr("y", barY + barH + 26)
        .style("fill", "var(--text-secondary)")
        .style("font", "13px var(--family-sans)")
        .text(d.detail);

      if (!reduceMotion) {
        bar.transition()
          .duration(1000)
          .delay(200 + i * 280)
          .ease(d3.easeCubicOut)
          .attr("width", xScale(d.astTo) - margin.left);

        valueText.transition()
          .duration(400)
          .delay(200 + i * 280 + 800)
          .style("opacity", 1);
      }
    });

    svg.append("text")
      .attr("x", width / 2)
      .attr("y", height - 8)
      .attr("text-anchor", "middle")
      .style("fill", "var(--text-tertiary)")
      .style("font", "italic 13px var(--family-sans)")
      .text("The Wolves asked the bottom player to do the top player's job.");
  }

  render();
  if (window.ResizeObserver) {
    new ResizeObserver(render).observe(root.node());
  }
})();
</script>
</div>
</body>
</html>
