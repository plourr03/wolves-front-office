<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>2023-24 league LAFI strip plot, preview harness</title>
<script src="https://d3js.org/d3.v7.min.js"></script>
<style>
  /* Dev harness only. Production supplies these tokens via /tokens.css. */
  :root {
    --accent-default:#00843D; --accent-hover:#00A04A; --accent-subtle:rgba(0,132,61,.18);
    --dataviz-1:#00C457; --dataviz-2:#FFFFFF; --dataviz-3:#4A9EFF; --dataviz-4:#F5A623;
    --dataviz-5:#FF5C8A; --dataviz-6:#B388FF; --dataviz-7:#7CE7B8; --dataviz-8:#FFD166;
    --text-primary:#FFFFFF; --text-secondary:rgba(255,255,255,.72); --text-tertiary:rgba(255,255,255,.48);
    --border-subtle:rgba(255,255,255,.08); --border-default:rgba(255,255,255,.16);
    --status-error:#FF5C5C; --status-warning:#F5A623; --status-info:#4A9EFF; --status-success:#00A04A;
    --bg-surface:#0E0E0E; --bg-inset:#050505;
    --family-sans:'Inter',system-ui,-apple-system,sans-serif;
    --family-mono:'JetBrains Mono',ui-monospace,Menlo,monospace;
    --radius-sm:4px; --radius-md:10px;
  }
  body { margin:0; padding:32px; background:#000; }
  .harness-note {
    max-width:840px; margin:0 auto 16px; color:rgba(255,255,255,.4);
    font:12px var(--family-sans);
  }
  .harness-stage { max-width:840px; margin:0 auto; }
</style>
</head>
<body>
<div class="harness-note">Local preview harness. The publishable artifact is lafi_2023_24_league_ranking_fragment.html. Hover any dot for the component breakdown.</div>
<div class="harness-stage">
<div id="viz-lafi-2023-24-league-ranking"></div>
<script>
(function () {
  var data = [
    { team: "DAL", name: "Dallas Mavericks",        full: 99, sharp: 99, stick: 94, motion: 93, iso: 98, poverty: 83, quality: 98 },
    { team: "HOU", name: "Houston Rockets",         full: 95, sharp: 91, stick: 90, motion: 94, iso: 77, poverty: 87, quality: 74 },
    { team: "LAC", name: "LA Clippers",             full: 94, sharp: 86, stick: 97, motion: 46, iso: 99, poverty: 81, quality: 99 },
    { team: "MIL", name: "Milwaukee Bucks",         full: 93, sharp: 93, stick: 87, motion: 91, iso: 78, poverty: 79, quality: 80 },
    { team: "BOS", name: "Boston Celtics",          full: 89, sharp: 89, stick: 73, motion: 83, iso: 84, poverty: 84, quality: 74 },
    { team: "NYK", name: "New York Knicks",         full: 84, sharp: 81, stick: 88, motion: 59, iso: 88, poverty: 62, quality: 76 },
    { team: "DET", name: "Detroit Pistons",         full: 82, sharp: 66, stick: 90, motion: 58, iso: 56, poverty: 83, quality: 77 },
    { team: "OKC", name: "Oklahoma City Thunder",   full: 77, sharp: 59, stick: 82, motion: 55, iso: 77, poverty: 89, quality: 30 },
    { team: "ATL", name: "Atlanta Hawks",           full: 73, sharp: 78, stick: 76, motion: 76, iso: 69, poverty: 44, quality: 70 },
    { team: "PHI", name: "Philadelphia 76ers",      full: 72, sharp: 82, stick: 56, motion: 57, iso: 91, poverty: 54, quality: 77 },
    { team: "LAL", name: "Los Angeles Lakers",      full: 71, sharp: 60, stick: 68, motion: 97, iso: 35, poverty: 85, quality: 35 },
    { team: "BKN", name: "Brooklyn Nets",           full: 69, sharp: 67, stick: 69, motion: 77, iso: 63, poverty: 63, quality: 45 },
    { team: "CHI", name: "Chicago Bulls",           full: 68, sharp: 77, stick: 25, motion: 100, iso: 58, poverty: 98, quality: 47 },
    { team: "PHX", name: "Phoenix Suns",            full: 66, sharp: 88, stick: 47, motion: 74, iso: 79, poverty: 34, quality: 90 },
    { team: "POR", name: "Portland Trail Blazers",  full: 61, sharp: 56, stick: 66, motion: 51, iso: 66, poverty: 67, quality: 39 },
    { team: "CHA", name: "Charlotte Hornets",       full: 58, sharp: 50, stick: 51, motion: 24, iso: 59, poverty: 83, quality: 68 },
    { team: "ORL", name: "Orlando Magic",           full: 47, sharp: 22, stick: 70, motion: 26, iso: 49, poverty: 59, quality: 12 },
    { team: "MIN", name: "Minnesota Timberwolves",  full: 35, sharp: 45, stick: 35, motion: 43, iso: 49, poverty: 27, quality: 39 },
    { team: "IND", name: "Indiana Pacers",          full: 26, sharp: 21, stick:  8, motion: 44, iso: 16, poverty: 73, quality: 30 },
    { team: "WAS", name: "Washington Wizards",      full: 25, sharp: 17, stick: 36, motion: 32, iso: 24, poverty: 41, quality: 23 },
    { team: "NOP", name: "New Orleans Pelicans",    full: 23, sharp: 40, stick:  6, motion: 59, iso: 43, poverty: 35, quality: 14 },
    { team: "MIA", name: "Miami Heat",              full: 21, sharp: 24, stick: 28, motion: 12, iso: 31, poverty: 24, quality: 56 },
    { team: "DEN", name: "Denver Nuggets",          full: 18, sharp: 26, stick: 27, motion: 26, iso: 21, poverty:  8, quality: 58 },
    { team: "SAC", name: "Sacramento Kings",        full: 17, sharp: 38, stick:  9, motion: 38, iso: 29, poverty:  6, quality: 56 },
    { team: "UTA", name: "Utah Jazz",               full: 13, sharp:  2, stick: 56, motion:  6, iso: 14, poverty: 12, quality: 14 },
    { team: "MEM", name: "Memphis Grizzlies",       full:  9, sharp:  9, stick: 23, motion: 29, iso: 17, poverty: 22, quality:  5 },
    { team: "GSW", name: "Golden State Warriors",   full:  8, sharp: 20, stick: 10, motion:  1, iso: 19, poverty:  1, quality: 81 },
    { team: "CLE", name: "Cleveland Cavaliers",     full:  5, sharp:  3, stick: 16, motion:  6, iso: 13, poverty: 18, quality: 19 },
    { team: "SAS", name: "San Antonio Spurs",       full:  5, sharp:  5, stick: 15, motion: 30, iso:  0, poverty: 16, quality:  8 },
    { team: "TOR", name: "Toronto Raptors",         full:  3, sharp:  3, stick:  7, motion: 25, iso:  3, poverty: 13, quality:  6 }
  ];
  var HIGHLIGHT = "MIN";
  var COMPONENTS = [
    { key: "stick",   label: "Ball stickiness" },
    { key: "motion",  label: "Motion death" },
    { key: "iso",     label: "Isolation reliance" },
    { key: "poverty", label: "Action poverty" },
    { key: "quality", label: "Shot quality decay" }
  ];

  var root = d3.select("#viz-lafi-2023-24-league-ranking");
  if (root.empty() || typeof d3 === "undefined") return;
  root.style("position", "relative");
  var reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  function buildTooltipHTML(d) {
    var parts = [];
    parts.push(
      '<div style="font:700 13px var(--family-sans); color:var(--text-primary); margin-bottom:6px;">'
      + d.name + ' <span style="color:var(--text-tertiary); font-weight:500;">(' + d.team + ')</span></div>'
    );
    parts.push(
      '<div style="display:flex; gap:14px; margin-bottom:8px; padding-bottom:8px; border-bottom:1px solid var(--border-subtle);">'
      + '<div><div style="font:10px var(--family-sans); color:var(--text-tertiary); text-transform:uppercase; letter-spacing:0.5px;">Full LAFI</div>'
      + '<div style="font:700 16px var(--family-mono); color:var(--text-primary);">' + d.full + '</div></div>'
      + '<div><div style="font:10px var(--family-sans); color:var(--text-tertiary); text-transform:uppercase; letter-spacing:0.5px;">Sharp LAFI</div>'
      + '<div style="font:700 16px var(--family-mono); color:var(--text-primary);">' + d.sharp + '</div></div>'
      + '</div>'
    );
    var rows = '';
    for (var i = 0; i < COMPONENTS.length; i++) {
      var c = COMPONENTS[i];
      rows +=
        '<div style="display:flex; justify-content:space-between; gap:16px;">'
        + '<span style="color:var(--text-secondary); font:12px var(--family-sans);">' + c.label + '</span>'
        + '<span style="color:var(--text-primary); font:600 12px var(--family-mono);">' + d[c.key] + '</span>'
        + '</div>';
    }
    parts.push('<div style="display:flex; flex-direction:column; gap:3px;">' + rows + '</div>');
    return parts.join('');
  }

  function render() {
    root.selectAll("*").remove();

    var raw = root.node().clientWidth || 640;
    var width = Math.max(320, Math.min(960, raw));
    var compact = width < 480;

    var margin = {
      top: 38,
      right: compact ? 18 : 24,
      bottom: 52,
      left: compact ? 18 : 24
    };
    var innerWidth = width - margin.left - margin.right;
    var innerHeight = compact ? 72 : 84;
    var height = margin.top + margin.bottom + innerHeight;

    var svg = root.append("svg")
      .attr("width", width)
      .attr("height", height)
      .attr("viewBox", "0 0 " + width + " " + height)
      .attr("role", "img")
      .style("display", "block")
      .style("max-width", "100%")
      .style("margin", "0 auto");

    var tooltip = root.append("div")
      .attr("class", "viz-tooltip")
      .style("position", "absolute")
      .style("pointer-events", "none")
      .style("opacity", 0)
      .style("transition", "opacity 120ms ease-out")
      .style("background", "var(--bg-surface)")
      .style("border", "1px solid var(--border-subtle)")
      .style("border-radius", "var(--radius-md)")
      .style("padding", "10px 12px")
      .style("min-width", "200px")
      .style("max-width", "260px")
      .style("box-shadow", "0 4px 16px rgba(0,0,0,.4)")
      .style("z-index", 10)
      .style("left", "0px")
      .style("top", "0px");

    var x = d3.scaleLinear().domain([0, 100]).range([0, innerWidth]);
    var centerY = innerHeight / 2;
    function dotR(d) {
      if (d.team === HIGHLIGHT) return compact ? 7 : 8;
      return compact ? 5 : 6;
    }

    var nodes = data.map(function (d) { return Object.assign({}, d); });
    var sim = d3.forceSimulation(nodes)
      .force("x", d3.forceX(function (d) { return x(d.full); }).strength(1))
      .force("y", d3.forceY(centerY).strength(0.08))
      .force("collide", d3.forceCollide(function (d) { return dotR(d) + 1.5; }))
      .stop();
    for (var i = 0; i < 260; i++) sim.tick();

    var g = svg.append("g")
      .attr("transform", "translate(" + margin.left + "," + margin.top + ")");

    g.append("line")
      .attr("x1", x(50))
      .attr("x2", x(50))
      .attr("y1", -10)
      .attr("y2", innerHeight + 10)
      .style("stroke", "var(--border-default)")
      .style("stroke-dasharray", "3,3")
      .style("stroke-width", 1);

    g.append("line")
      .attr("x1", 0)
      .attr("x2", innerWidth)
      .attr("y1", innerHeight + 10)
      .attr("y2", innerHeight + 10)
      .style("stroke", "var(--border-subtle)")
      .style("stroke-width", 1);

    [0, 25, 50, 75, 100].forEach(function (v) {
      g.append("line")
        .attr("x1", x(v))
        .attr("x2", x(v))
        .attr("y1", innerHeight + 10)
        .attr("y2", innerHeight + 14)
        .style("stroke", "var(--border-default)")
        .style("stroke-width", 1);
      g.append("text")
        .attr("x", x(v))
        .attr("y", innerHeight + 26)
        .attr("text-anchor", "middle")
        .style("fill", "var(--text-tertiary)")
        .style("font", "10px var(--family-mono)")
        .text(v);
    });

    g.append("text")
      .attr("x", 0)
      .attr("y", innerHeight + 42)
      .attr("text-anchor", "start")
      .style("fill", "var(--text-tertiary)")
      .style("font", "11px var(--family-sans)")
      .text("more designed");

    g.append("text")
      .attr("x", x(50))
      .attr("y", innerHeight + 42)
      .attr("text-anchor", "middle")
      .style("fill", "var(--text-tertiary)")
      .style("font", "11px var(--family-sans)")
      .text(compact ? "avg" : "league avg");

    g.append("text")
      .attr("x", innerWidth)
      .attr("y", innerHeight + 42)
      .attr("text-anchor", "end")
      .style("fill", "var(--text-tertiary)")
      .style("font", "11px var(--family-sans)")
      .text("more pickup");

    var dots = g.append("g").selectAll("circle").data(nodes).join("circle")
      .attr("cx", function (d) { return d.x; })
      .attr("cy", function (d) { return d.y; })
      .attr("r", reduceMotion ? dotR : 0)
      .style("fill", function (d) {
        return d.team === HIGHLIGHT
          ? "var(--accent-default)"
          : "var(--border-default)";
      })
      .style("stroke", function (d) {
        return d.team === HIGHLIGHT
          ? "var(--accent-hover)"
          : "rgba(255,255,255,.04)";
      })
      .style("stroke-width", function (d) {
        return d.team === HIGHLIGHT ? 2 : 1;
      })
      .style("cursor", "pointer");

    dots.append("title")
      .text(function (d) {
        return d.name + ": Full LAFI " + d.full + ", Sharp " + d.sharp
          + " (Stickiness " + d.stick + ", Motion " + d.motion
          + ", Iso " + d.iso + ", Poverty " + d.poverty
          + ", Shot quality " + d.quality + ")";
      });

    dots
      .on("mouseenter", function (event, d) {
        d3.select(this).style("fill",
          d.team === HIGHLIGHT
            ? "var(--accent-hover)"
            : "var(--text-secondary)");
        tooltip.html(buildTooltipHTML(d)).style("opacity", 1);
      })
      .on("mousemove", function (event) {
        var rect = root.node().getBoundingClientRect();
        var cx = event.clientX - rect.left;
        var cy = event.clientY - rect.top;
        var ttNode = tooltip.node();
        var tw = ttNode.offsetWidth || 220;
        var th = ttNode.offsetHeight || 180;
        var left = cx + 14;
        if (left + tw > rect.width) left = cx - tw - 14;
        if (left < 0) left = 4;
        var top = cy + 14;
        if (top + th > rect.height) top = cy - th - 14;
        if (top < 0) top = 4;
        tooltip.style("left", left + "px").style("top", top + "px");
      })
      .on("mouseleave", function (event, d) {
        d3.select(this).style("fill",
          d.team === HIGHLIGHT
            ? "var(--accent-default)"
            : "var(--border-default)");
        tooltip.style("opacity", 0);
      });

    if (!reduceMotion) {
      dots.transition()
        .duration(500)
        .delay(function (d, i) { return i * 12; })
        .ease(d3.easeCubicOut)
        .attr("r", dotR);
    }

    var minNode = nodes.find(function (d) { return d.team === HIGHLIGHT; });
    if (minNode) {
      var labelY = minNode.y - dotR(minNode) - 14;
      g.append("line")
        .attr("x1", minNode.x)
        .attr("x2", minNode.x)
        .attr("y1", minNode.y - dotR(minNode) - 2)
        .attr("y2", labelY + 3)
        .style("stroke", "var(--accent-default)")
        .style("stroke-width", 1);
      g.append("text")
        .attr("x", minNode.x)
        .attr("y", labelY)
        .attr("text-anchor", "middle")
        .style("fill", "var(--accent-default)")
        .style("font", "700 12px var(--family-sans)")
        .text("Wolves, " + minNode.full);
    }
  }

  render();
  if (window.ResizeObserver) {
    new ResizeObserver(render).observe(root.node());
  }
})();
</script>
</div>
</body>
</html>
