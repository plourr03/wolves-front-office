<div id="viz-tornado"></div>
<style>
  /* Force vertical scroll/swipe to pass through every descendant. */
  #viz-tornado, #viz-tornado * { touch-action: manipulation; }
  #viz-tornado .tn-caption {
    max-width: 640px; margin: 10px auto 0;
    font: 12px var(--family-sans); color: var(--text-tertiary);
  }
</style>
<script>
(function () {
  // S7 tornado: delta on the total package bill (4-yr VORP) per pre-declared
  // arm, CRN-paired against a same-seed 20k base (total 4.77).
  // Source: pick2033 outputs/json/tornado_FINAL.json.
  var BASE = 4.77;
  var data = [
    { label: "Star departure odds halved", short: "Hazard 0.5x", d: -0.52 },
    { label: "Star departure odds 1.5x", short: "Hazard 1.5x", d: 0.45 },
    { label: "LaMelo signs the extension", short: "LaMelo extends", d: -0.41 },
    { label: "Roster trust fades faster", short: "Blend faster", d: 0.29 },
    { label: "No swap on a #1 pick in 2030", short: "2030 top-1 flag", d: -0.16 },
    { label: "Roster trust fades slower", short: "Blend slower", d: -0.13 },
    { label: "One shared franchise DNA (pooled)", short: "Pooled DNA", d: -0.06 },
    { label: "Faster mean reversion (phi p10)", short: "phi p10", d: 0.06 },
    { label: "Contract labels split at midpoints", short: "S-CONTRACT", d: -0.04 },
    { label: "Stickier trajectories (phi p90)", short: "phi p90", d: -0.03 },
    { label: "Charlotte lineage starts 2005", short: "CHA lineage", d: 0.03 },
    { label: "Play-in as a coin flip", short: "Play-in crude", d: 0.02 },
    { label: "Milder shock years (p10)", short: "Shock p10", d: 0.01 },
    { label: "Wilder shock years (p90)", short: "Shock p90", d: 0.0 }
  ];

  var root = d3.select("#viz-tornado");
  var reduceMotion =
    window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  if (window.parent !== window) {
    root.node().addEventListener("wheel", function (e) {
      if (e.ctrlKey || e.metaKey) return;
      try { window.parent.scrollBy(e.deltaX, e.deltaY); }
      catch (err) {
        window.parent.postMessage({ type: "viz-scroll", deltaX: e.deltaX, deltaY: e.deltaY }, "*");
      }
    }, { passive: true });
    var lastTouchY = null;
    root.node().addEventListener("touchstart", function (e) {
      if (e.touches.length === 1) lastTouchY = e.touches[0].clientY;
    }, { passive: true });
    root.node().addEventListener("touchmove", function (e) {
      if (e.touches.length !== 1 || lastTouchY === null) return;
      var y = e.touches[0].clientY, dy = lastTouchY - y;
      lastTouchY = y;
      try { window.parent.scrollBy(0, dy); }
      catch (err) {
        window.parent.postMessage({ type: "viz-scroll", deltaX: 0, deltaY: dy }, "*");
      }
    }, { passive: true });
  }

  function render() {
    root.selectAll("*").remove();

    var raw = root.node().clientWidth || 640;
    var width = Math.max(320, Math.min(960, raw));
    var compact = width < 480;
    var rowH = compact ? 46 : 34;
    var barH = compact ? 12 : 16;
    var margin = { top: 42, right: compact ? 44 : 54, bottom: 26, left: compact ? 8 : 224 };
    var height = margin.top + margin.bottom + data.length * rowH;

    var svg = root.append("svg")
      .attr("width", width).attr("height", height)
      .attr("viewBox", "0 0 " + width + " " + height)
      .attr("role", "img")
      .style("display", "block").style("max-width", "100%").style("margin", "0 auto");

    var x = d3.scaleLinear()
      .domain([-0.62, 0.55])
      .range([margin.left, width - margin.right]);

    function rowTop(i) { return margin.top + i * rowH; }
    var barOffset = compact ? 22 : (rowH - barH) / 2;

    // Direction headers.
    svg.append("text")
      .attr("x", x(0) - 8).attr("y", margin.top - 24).attr("text-anchor", "end")
      .style("fill", "var(--accent-default)").style("font", "600 12px var(--family-sans)")
      .text(compact ? "bill shrinks" : "the bill shrinks");
    svg.append("text")
      .attr("x", x(0) + 8).attr("y", margin.top - 24)
      .style("fill", "var(--status-error)").style("font", "600 12px var(--family-sans)")
      .text(compact ? "bill grows" : "the bill grows");
    svg.append("text")
      .attr("x", x(0)).attr("y", margin.top - 10).attr("text-anchor", "middle")
      .style("fill", "var(--text-tertiary)").style("font", "11px var(--family-sans)")
      .text("base: " + BASE.toFixed(2) + " wins");

    // Zero axis.
    svg.append("line")
      .attr("x1", x(0)).attr("x2", x(0))
      .attr("y1", margin.top - 6).attr("y2", height - margin.bottom + 2)
      .style("stroke", "var(--border-default)");

    // Labels.
    svg.append("g").selectAll("text").data(data).join("text")
      .attr("x", compact ? margin.left : margin.left - 12)
      .attr("y", function (d, i) { return rowTop(i) + (compact ? 12 : rowH / 2); })
      .attr("dy", compact ? "0" : "0.35em")
      .attr("text-anchor", compact ? "start" : "end")
      .style("fill", "var(--text-secondary)").style("font", "13px var(--family-sans)")
      .text(function (d) { return compact ? d.short : d.label; });

    // Bars.
    var bars = svg.append("g").selectAll("rect").data(data).join("rect")
      .attr("y", function (d, i) { return rowTop(i) + barOffset; })
      .attr("height", barH).attr("rx", 3)
      .style("fill", function (d) {
        return d.d < 0 ? "var(--accent-default)" : "var(--status-error)";
      })
      .style("cursor", "pointer")
      .attr("x", x(0)).attr("width", 0);
    var grow = function (sel) {
      sel.attr("x", function (d) { return Math.min(x(0), x(d.d)); })
        .attr("width", function (d) { return Math.max(Math.abs(x(d.d) - x(0)), 2); });
    };
    if (reduceMotion) { grow(bars); }
    else {
      grow(bars.transition().duration(600)
        .delay(function (_, i) { return i * 50; }).ease(d3.easeCubicOut));
    }
    bars.append("title").text(function (d) {
      return d.label + ": total " + (BASE + d.d).toFixed(2) + " wins (" +
        (d.d >= 0 ? "+" : "") + d.d.toFixed(2) + " vs base)";
    });
    bars.on("mouseenter", function (e, d) {
      d3.select(this).style("fill", d.d < 0 ? "var(--accent-hover)" : "#FF7A7A");
    }).on("mouseleave", function (e, d) {
      d3.select(this).style("fill", d.d < 0 ? "var(--accent-default)" : "var(--status-error)");
    });

    // Value labels.
    svg.append("g").selectAll("text").data(data).join("text")
      .attr("x", function (d) { return d.d < 0 ? x(d.d) - 8 : x(Math.max(d.d, 0)) + 8; })
      .attr("y", function (d, i) { return rowTop(i) + barOffset + barH / 2; })
      .attr("dy", "0.35em")
      .attr("text-anchor", function (d) { return d.d < 0 ? "end" : "start"; })
      .style("fill", "var(--text-primary)").style("font", "600 12px var(--family-mono)")
      .text(function (d) { return (d.d >= 0 ? "+" : "") + d.d.toFixed(2); });

    // Watermark + date stamp. Travels with the chart in screenshots.
    svg.append("text")
      .attr("x", width - 6).attr("y", height - 6).attr("text-anchor", "end")
      .style("fill", "var(--text-tertiary)").style("font", "9px var(--family-sans)")
      .style("opacity", 0.55).style("pointer-events", "none")
      .text("@WolvesToaT · Jul 2026");

    root.append("div").attr("class", "tn-caption")
      .text("Fourteen pre-declared stress tests of the total bill, each a full re-run, " +
        "paired on identical random paths. The win-shares currency arm is reported in " +
        "the data file (different units, same shape). Nothing flips: the bill stays " +
        "between 4.3 and 5.2 wins in every arm.");
  }

  render();
  if (window.ResizeObserver) { new ResizeObserver(render).observe(root.node()); }
})();
</script>
