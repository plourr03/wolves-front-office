<div id="viz-edwards-conley-trajectory"></div>
<style>
  /* Force vertical scroll/swipe to pass through every descendant. */
  #viz-edwards-conley-trajectory, #viz-edwards-conley-trajectory * { touch-action: manipulation; }
</style>
<script>
(function () {
  var seasons = ["2023-24", "2024-25", "2025-26"];

  var metrics = [
    {
      key: "conley",
      label: "Conley's minutes per game",
      labelFull: "Conley minutes per game",
      unit: "",
      values: [29, 25, 18],
      color: "var(--dataviz-3)",
      width: 3,
      deltaText: "29 down to 18 minutes"
    },
    {
      key: "assist",
      label: "Edwards's assist rate",
      labelFull: "Edwards assist rate",
      unit: "%",
      values: [24, 21, 18],
      color: "var(--accent-default)",
      width: 3,
      deltaText: "24% down to 18%"
    }
  ];

  var root = d3.select("#viz-edwards-conley-trajectory");
  var reduceMotion =
    window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  // Scroll passthrough. touch-action lets mobile vertical swipes scroll the
  // page through the viz; in an iframe context we also forward wheel to
  // the parent so desktop wheel doesn't get trapped.
  if (root.node()) {
    root.node().style.touchAction = "manipulation";
    if (window.parent !== window) {
      root.node().addEventListener("wheel", function (e) {
        if (e.ctrlKey || e.metaKey) return;
        try {
          window.parent.scrollBy(e.deltaX, e.deltaY);
        } catch (err) {
          window.parent.postMessage({
            type: "viz-scroll",
            deltaX: e.deltaX,
            deltaY: e.deltaY
          }, "*");
        }
      }, { passive: true });
      var lastTouchY = null;
      root.node().addEventListener("touchstart", function (e) {
        if (e.touches.length === 1) lastTouchY = e.touches[0].clientY;
      }, { passive: true });
      root.node().addEventListener("touchmove", function (e) {
        if (e.touches.length !== 1 || lastTouchY === null) return;
        var y = e.touches[0].clientY;
        var dy = lastTouchY - y;
        lastTouchY = y;
        try {
          window.parent.scrollBy(0, dy);
        } catch (err) {
          window.parent.postMessage({
            type: "viz-scroll",
            deltaX: 0,
            deltaY: dy
          }, "*");
        }
      }, { passive: true });
    }
  }

  function render() {
    root.selectAll("*").remove();

    var raw = root.node().clientWidth || 640;
    var width = Math.max(320, Math.min(960, raw));
    var compact = width < 480;

    var height = compact ? 420 : 340;

    var margin = {
      top: compact ? 100 : 92,
      right: compact ? 16 : 180,
      bottom: compact ? 80 : 44,
      left: compact ? 16 : 16
    };

    var svg = root.append("svg")
      .attr("width", width)
      .attr("height", height)
      .attr("viewBox", "0 0 " + width + " " + height)
      .attr("role", "img")
      .style("display", "block")
      .style("max-width", "100%")
      .style("margin", "0 auto");

    // Headline carries the frame the chart needs.
    var head = svg.append("g");

    head.append("text")
      .attr("x", margin.left)
      .attr("y", 24)
      .style("fill", "var(--text-primary)")
      .style("font", "700 17px var(--family-sans)")
      .text("Edwards used 31% of possessions every year.");

    head.append("text")
      .attr("x", margin.left)
      .attr("y", 48)
      .style("fill", "var(--text-primary)")
      .style("font", "700 17px var(--family-sans)")
      .text("These two fell anyway.");

    head.append("text")
      .attr("x", margin.left)
      .attr("y", 70)
      .style("fill", "var(--text-tertiary)")
      .style("font", "12px var(--family-sans)")
      .text("Same scoring load. Different team around him.");

    var innerW = width - margin.left - margin.right;
    var innerH = height - margin.top - margin.bottom;

    var g = svg.append("g")
      .attr("transform", "translate(" + margin.left + "," + margin.top + ")");

    var xScale = d3.scalePoint()
      .domain(seasons)
      .range([28, innerW - 28])
      .padding(0);

    var allValues = metrics.reduce(function (arr, m) {
      return arr.concat(m.values);
    }, []);
    var yMin = d3.min(allValues);
    var yMax = d3.max(allValues);

    var yScale = d3.scaleLinear()
      .domain([yMin - 4, yMax + 3])
      .range([innerH, 0]);

    // Baseline at the bottom of the plot area
    g.append("line")
      .attr("x1", 0).attr("y1", innerH)
      .attr("x2", innerW).attr("y2", innerH)
      .style("stroke", "var(--border-subtle)")
      .style("stroke-width", 1);

    // Season labels under the baseline
    g.selectAll(".season-label").data(seasons).join("text")
      .attr("class", "season-label")
      .attr("x", function (d) { return xScale(d); })
      .attr("y", innerH + 26)
      .attr("text-anchor", "middle")
      .style("fill", "var(--text-secondary)")
      .style("font", "13px var(--family-sans)")
      .text(function (d) { return d; });

    // Faint vertical guides so the eye can track the same season across both lines
    g.selectAll(".guide").data(seasons).join("line")
      .attr("class", "guide")
      .attr("x1", function (d) { return xScale(d); })
      .attr("y1", 0)
      .attr("x2", function (d) { return xScale(d); })
      .attr("y2", innerH)
      .style("stroke", "var(--border-subtle)")
      .style("stroke-dasharray", "2,4")
      .style("opacity", 0.5);

    // Draw lines + area fills + markers per metric.
    metrics.forEach(function (metric, i) {
      var lineData = seasons.map(function (s, idx) {
        return { season: s, value: metric.values[idx], metric: metric };
      });

      // Subtle area fill under each line for visual weight
      var area = d3.area()
        .x(function (d) { return xScale(d.season); })
        .y0(innerH)
        .y1(function (d) { return yScale(d.value); });

      g.append("path")
        .datum(lineData)
        .attr("d", area)
        .style("fill", metric.color)
        .style("opacity", reduceMotion ? 0.12 : 0)
        .transition()
        .duration(800)
        .delay(200 + i * 220 + 600)
        .style("opacity", 0.12);

      var line = d3.line()
        .x(function (d) { return xScale(d.season); })
        .y(function (d) { return yScale(d.value); });

      var path = g.append("path")
        .datum(lineData)
        .attr("d", line)
        .style("fill", "none")
        .style("stroke", metric.color)
        .style("stroke-width", metric.width)
        .style("stroke-linecap", "round")
        .style("stroke-linejoin", "round");

      if (!reduceMotion) {
        var totalLen = path.node().getTotalLength();
        path
          .attr("stroke-dasharray", totalLen + " " + totalLen)
          .attr("stroke-dashoffset", totalLen)
          .transition()
          .duration(900)
          .delay(200 + i * 220)
          .ease(d3.easeCubicOut)
          .attr("stroke-dashoffset", 0);
      }

      // Markers
      var points = g.selectAll(".pt-" + metric.key).data(lineData).join("g")
        .attr("class", "pt-" + metric.key)
        .attr("transform", function (d) {
          return "translate(" + xScale(d.season) + "," + yScale(d.value) + ")";
        })
        .style("cursor", "pointer")
        .style("opacity", reduceMotion ? 1 : 0);

      points.append("circle")
        .attr("r", 6)
        .style("fill", metric.color)
        .style("stroke", "var(--bg-inset)")
        .style("stroke-width", 2);

      points.append("title")
        .text(function (d) {
          return metric.labelFull + ", " + d.season + ": " +
            d.value + metric.unit;
        });

      points
        .on("mouseenter", function () {
          d3.select(this).select("circle")
            .style("fill", "var(--accent-hover)")
            .attr("r", 9);
        })
        .on("mouseleave", function () {
          d3.select(this).select("circle")
            .style("fill", metric.color)
            .attr("r", 6);
        });

      if (!reduceMotion) {
        points.transition()
          .duration(400)
          .delay(function (_, idx) {
            return 200 + i * 220 + 200 + idx * 200;
          })
          .style("opacity", 1);
      }

      // Per-point value labels above each marker
      var valueLabels = g.selectAll(".val-" + metric.key).data(lineData).join("text")
        .attr("class", "val-" + metric.key)
        .attr("x", function (d) { return xScale(d.season); })
        .attr("y", function (d) { return yScale(d.value) - 14; })
        .attr("text-anchor", "middle")
        .style("fill", "var(--text-primary)")
        .style("font", "600 13px var(--family-mono)")
        .style("opacity", reduceMotion ? 1 : 0)
        .text(function (d) { return d.value + metric.unit; });

      if (!reduceMotion) {
        valueLabels.transition()
          .duration(400)
          .delay(function (_, idx) {
            return 200 + i * 220 + 400 + idx * 200;
          })
          .style("opacity", 1);
      }

      // Right side label block per line (desktop only)
      if (!compact) {
        var lastPoint = lineData[lineData.length - 1];
        // Both lines end at 18; offset labels so they don't collide
        var labelYOffset = 0;
        if (metric.key === "conley") labelYOffset = -18;
        if (metric.key === "assist") labelYOffset = 18;

        var labelG = g.append("g")
          .attr(
            "transform",
            "translate(" + (xScale(lastPoint.season) + 18) + "," +
              (yScale(lastPoint.value) + labelYOffset) + ")"
          )
          .style("opacity", reduceMotion ? 1 : 0);

        if (labelYOffset !== 0) {
          labelG.append("line")
            .attr("x1", -12)
            .attr("y1", -labelYOffset)
            .attr("x2", -4)
            .attr("y2", 0)
            .style("stroke", metric.color)
            .style("stroke-width", 1)
            .style("opacity", 0.6);
        }

        labelG.append("text")
          .attr("x", 0).attr("y", 0)
          .style("fill", metric.color)
          .style("font", "700 13px var(--family-sans)")
          .text(metric.label);

        labelG.append("text")
          .attr("x", 0).attr("y", 16)
          .style("fill", "var(--text-secondary)")
          .style("font", "12px var(--family-sans)")
          .text(metric.deltaText);

        if (!reduceMotion) {
          labelG.transition()
            .duration(400)
            .delay(200 + i * 220 + 900)
            .style("opacity", 1);
        }
      }
    });

    // Compact: small inline legend underneath since right-side labels are skipped
    if (compact) {
      var legend = svg.append("g")
        .attr("transform", "translate(" + margin.left + "," + (height - 32) + ")");

      metrics.forEach(function (m, i) {
        var row = legend.append("g")
          .attr("transform", "translate(0," + (i * 16 - 10) + ")");

        row.append("line")
          .attr("x1", 0).attr("y1", 0)
          .attr("x2", 22).attr("y2", 0)
          .style("stroke", m.color)
          .style("stroke-width", m.width)
          .style("stroke-linecap", "round");

        row.append("text")
          .attr("x", 30).attr("y", 0).attr("dy", "0.35em")
          .style("fill", "var(--text-secondary)")
          .style("font", "12px var(--family-sans)")
          .text(m.label + ", " + m.deltaText);
      });
    }

    // Watermark + date stamp. Travels with the chart in screenshots.
    svg.append("text")
      .attr("x", width - 6)
      .attr("y", height - 6)
      .attr("text-anchor", "end")
      .style("fill", "var(--text-tertiary)")
      .style("font", "9px var(--family-sans)")
      .style("opacity", 0.55)
      .style("pointer-events", "none")
      .text("@WolvesToaT · May 2026");
  }

  render();
  if (window.ResizeObserver) {
    new ResizeObserver(render).observe(root.node());
  }
})();
</script>
