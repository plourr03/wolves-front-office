<div id="viz-edwards-conley-bar"></div>
<style>
  /* Force vertical scroll/swipe to pass through every descendant. */
  #viz-edwards-conley-bar, #viz-edwards-conley-bar * { touch-action: manipulation; }
</style>
<script>
(function () {
  var data = [
    {
      name: "Mike Conley",
      role: "The point guard the Wolves had",
      astTo: 4.4,
      color: "var(--dataviz-3)",
      detail: "Held above 4.2 every season the Wolves had him."
    },
    {
      name: "Anthony Edwards",
      role: "The point guard the Wolves used",
      astTo: 1.4,
      color: "var(--accent-default)",
      detail: "Between 1.3 and 1.7 each of the last three seasons."
    }
  ];

  var root = d3.select("#viz-edwards-conley-bar");
  var reduceMotion =
    window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  // Scroll passthrough. touch-action lets mobile vertical swipes scroll the
  // page through the viz; in an iframe context we also forward wheel to
  // the parent so desktop wheel doesn't get trapped.
  if (root.node()) {
    root.node().style.touchAction = "manipulation";
    if (window.parent !== window) {
      root.node().addEventListener("wheel", function (e) {
        if (e.ctrlKey || e.metaKey) return;
        try {
          window.parent.scrollBy(e.deltaX, e.deltaY);
        } catch (err) {
          window.parent.postMessage({
            type: "viz-scroll",
            deltaX: e.deltaX,
            deltaY: e.deltaY
          }, "*");
        }
      }, { passive: true });
      var lastTouchY = null;
      root.node().addEventListener("touchstart", function (e) {
        if (e.touches.length === 1) lastTouchY = e.touches[0].clientY;
      }, { passive: true });
      root.node().addEventListener("touchmove", function (e) {
        if (e.touches.length !== 1 || lastTouchY === null) return;
        var y = e.touches[0].clientY;
        var dy = lastTouchY - y;
        lastTouchY = y;
        try {
          window.parent.scrollBy(0, dy);
        } catch (err) {
          window.parent.postMessage({
            type: "viz-scroll",
            deltaX: 0,
            deltaY: dy
          }, "*");
        }
      }, { passive: true });
    }
  }

  function render() {
    root.selectAll("*").remove();

    var raw = root.node().clientWidth || 640;
    var width = Math.max(320, Math.min(960, raw));
    var compact = width < 480;

    var rowH = compact ? 132 : 108;
    var headerH = 84;
    var height = headerH + data.length * rowH + 24;

    var margin = {
      right: 88,
      left: compact ? 16 : 200
    };

    var svg = root.append("svg")
      .attr("width", width)
      .attr("height", height)
      .attr("viewBox", "0 0 " + width + " " + height)
      .attr("role", "img")
      .style("display", "block")
      .style("max-width", "100%")
      .style("margin", "0 auto");

    // Header
    svg.append("text")
      .attr("x", 16)
      .attr("y", 30)
      .style("fill", "var(--text-primary)")
      .style("font", "700 22px var(--family-sans)")
      .text("Edwards is not Conley.");

    svg.append("text")
      .attr("x", 16)
      .attr("y", 56)
      .style("fill", "var(--text-secondary)")
      .style("font", "13px var(--family-sans)")
      .text("Assists per turnover, the simplest measure of a playmaker.");

    // Track ("how good a playmaker can be") and bars
    var xScale = d3.scaleLinear()
      .domain([0, 5])
      .range([margin.left, width - margin.right]);

    data.forEach(function (d, i) {
      var rowTop = headerH + i * rowH;

      var barY = compact ? rowTop + 60 : rowTop + 36;
      var barH = compact ? 26 : 30;

      // Name (left of bar on desktop; above on mobile)
      svg.append("text")
        .attr("x", compact ? 16 : margin.left - 16)
        .attr("y", compact ? rowTop + 20 : barY + barH / 2 - 4)
        .attr("text-anchor", compact ? "start" : "end")
        .attr("dy", compact ? "0" : "0")
        .style("fill", "var(--text-primary)")
        .style("font", "700 17px var(--family-sans)")
        .text(d.name);

      svg.append("text")
        .attr("x", compact ? 16 : margin.left - 16)
        .attr("y", compact ? rowTop + 38 : barY + barH / 2 + 14)
        .attr("text-anchor", compact ? "start" : "end")
        .style("fill", "var(--text-tertiary)")
        .style("font", "12px var(--family-sans)")
        .text(d.role);

      // Track behind the bar shows "the range a playmaker lives in"
      svg.append("rect")
        .attr("x", margin.left)
        .attr("y", barY)
        .attr("width", xScale(5) - margin.left)
        .attr("height", barH)
        .attr("rx", 4)
        .style("fill", "var(--bg-surface)")
        .style("stroke", "var(--border-subtle)")
        .style("stroke-width", 1);

      // The actual bar
      var bar = svg.append("rect")
        .attr("x", margin.left)
        .attr("y", barY)
        .attr("height", barH)
        .attr("rx", 4)
        .style("fill", d.color)
        .style("cursor", "pointer")
        .attr("width", reduceMotion ? xScale(d.astTo) - margin.left : 0);

      bar.append("title").text(d.name + ": " + d.astTo + " assist/turnover");

      bar
        .on("mouseenter", function () {
          d3.select(this).style("fill", "var(--accent-hover)");
        })
        .on("mouseleave", function () {
          d3.select(this).style("fill", d.color);
        });

      // Value at the end of the bar
      var valueText = svg.append("text")
        .attr("x", xScale(d.astTo) + 14)
        .attr("y", barY + barH / 2)
        .attr("dy", "0.35em")
        .style("fill", d.color)
        .style("font", "800 32px var(--family-mono)")
        .style("opacity", reduceMotion ? 1 : 0)
        .text(d.astTo);

      // Detail text below the bar
      svg.append("text")
        .attr("x", compact ? 16 : margin.left)
        .attr("y", barY + barH + 26)
        .style("fill", "var(--text-secondary)")
        .style("font", "13px var(--family-sans)")
        .text(d.detail);

      if (!reduceMotion) {
        bar.transition()
          .duration(1000)
          .delay(200 + i * 280)
          .ease(d3.easeCubicOut)
          .attr("width", xScale(d.astTo) - margin.left);

        valueText.transition()
          .duration(400)
          .delay(200 + i * 280 + 800)
          .style("opacity", 1);
      }
    });

    // Footer: the punchline
    svg.append("text")
      .attr("x", width / 2)
      .attr("y", height - 8)
      .attr("text-anchor", "middle")
      .style("fill", "var(--text-tertiary)")
      .style("font", "italic 13px var(--family-sans)")
      .text("The Wolves asked the bottom player to do the top player's job.");

    // Watermark + date stamp. Travels with the chart in screenshots.
    svg.append("text")
      .attr("x", width - 6)
      .attr("y", height - 6)
      .attr("text-anchor", "end")
      .style("fill", "var(--text-tertiary)")
      .style("font", "9px var(--family-sans)")
      .style("opacity", 0.55)
      .style("pointer-events", "none")
      .text("@WolvesToaT · May 2026");
  }

  render();
  if (window.ResizeObserver) {
    new ResizeObserver(render).observe(root.node());
  }
})();
</script>
